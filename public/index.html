<body>

<canvas id="scene" aria-hidden="true"></canvas>
<div class="atmos" aria-hidden="true"></div>

<main>
  <!-- I. Night: Let there be light -->
  <section class="panel hero" data-step="0">
    <div class="copy">
      <h1 class="display">
        <span class="line"><span>A foundation</span></span>
        <span class="line"><span><em>for tomorrow.</em></span></span>
      </h1>
      <div class="scroll-cue" aria-hidden="true"><span></span></div>
    </div>
  </section>

  <!-- II. Who we are -->
  <section class="panel who" data-step="1">
    <div class="copy">
      <p class="index reveal">I</p>
      <p class="lede reveal-words">We are a family office wanting to create a little good for the world,</p>
    </div>
  </section>

  <section class="panel faith" data-step="2">
    <div class="copy">
      <p class="index reveal">II</p>
      <p class="lede reveal-words">and to do that we put our faith in <em>God.</em></p>
    </div>
  </section>

  <!-- III. Day: the Creation of Adam -->
  <section class="panel verse" data-step="3">
    <div class="copy">
      <figure>
        <blockquote class="reveal-words">And God saw every thing that he had made, and, behold, it was very good.</blockquote>
        <figcaption class="reveal">Genesis 1:31</figcaption>
      </figure>
    </div>
  </section>

  <!-- IV. Close -->
  <section class="panel close" data-step="4">
    <div class="copy">
      <p class="coda reveal">A foundation for tomorrow</p>
    </div>
  </section>
</main>
