<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Solichin — A foundation for tomorrow</title>
<meta name="description" content="Solichin is a family office wanting to create a little good for the world, and to do that we put our faith in God.">
<meta name="theme-color" content="#0b0a09">
<meta name="color-scheme" content="dark">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta property="og:type" content="website">
<meta property="og:url" content="https://solichin.org/">
<meta property="og:title" content="Solichin">
<meta property="og:description" content="A foundation for tomorrow.">
<meta property="og:image" content="https://solichin.org/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.min.js" crossorigin>
<link rel="stylesheet" href="/style.css">
<script>document.documentElement.classList.add('js')</script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.min.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
</head>
<body>

<canvas id="scene" aria-hidden="true"></canvas>
<div class="atmos" aria-hidden="true"></div>

<header class="nav">
  <a class="brand" href="/" aria-label="Solichin">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="13" width="9" height="8" rx=".6" fill="currentColor"/><rect x="12.6" y="13" width="8.4" height="8" rx=".6" fill="currentColor" opacity=".35"/><rect x="3" y="4.4" width="9" height="8" rx=".6" fill="currentColor" opacity=".35"/></svg>
    <span>Solichin</span>
  </a>
  <span class="nav-meta">Family Office</span>
</header>

<main>
  <!-- I. The cornerstone -->
  <section class="panel hero" data-step="0">
    <div class="copy">
      <p class="eyebrow reveal">Solichin · Family Office</p>
      <h1 class="display">
        <span class="line"><span>A foundation</span></span>
        <span class="line"><span><em>for tomorrow.</em></span></span>
      </h1>
      <div class="scroll-cue" aria-hidden="true"><span></span></div>
    </div>
  </section>

  <!-- II. Who we are -->
  <section class="panel who" data-step="1">
    <div class="copy">
      <p class="index reveal">I</p>
      <p class="lede reveal-words">We are a family office wanting to create a little good for the world,</p>
    </div>
  </section>

  <section class="panel faith" data-step="2">
    <div class="copy">
      <p class="index reveal">II</p>
      <p class="lede reveal-words">and to do that we put our faith in <em>God.</em></p>
    </div>
  </section>

  <!-- III. The stone -->
  <section class="panel verse" data-step="3">
    <div class="copy">
      <figure>
        <blockquote class="reveal-words">Behold, I lay in Zion for a foundation a stone, a tried stone, a precious corner stone, a sure foundation.</blockquote>
        <figcaption class="reveal">Isaiah 28:16</figcaption>
      </figure>
    </div>
  </section>

  <!-- IV. Close -->
  <section class="panel close" data-step="4">
    <div class="copy">
      <h2 class="wordmark reveal">Solichin</h2>
      <footer class="foot reveal">
        <span>© <span id="year">2026</span> Solichin</span>
        <span>Family Office</span>
        <span>solichin.org</span>
      </footer>
    </div>
  </section>
</main>


<noscript><style>.reveal,.reveal-words,.display .line>span{opacity:1!important;transform:none!important}</style></noscript>
<script type="module" src="/main.js"></script>
</body>
</html>
